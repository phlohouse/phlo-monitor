name: Release Linux binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag reachable from main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Validate release request
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/main
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve tag on main
        id: tag
        run: |
          commit=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          git merge-base --is-ancestor "$commit" origin/main
          git checkout --detach "$commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.x'
          cache: false
      - name: Validate and package tagged source
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
          bash scripts/package-release.sh "$TAG" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
      COMMIT: ${{ needs.build.outputs.commit }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - name: Check tag, checksums, and unused release version
        run: |
          test "$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)" = "$COMMIT"
          (cd dist && sha256sum --strict --check "phlo-monitor_${TAG}_SHA256SUMS")
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[].tag_name' > "$RUNNER_TEMP/release-tags"
          if grep -Fxq -- "$TAG" "$RUNNER_TEMP/release-tags"; then
            echo 'Release already exists; refusing to overwrite it.' >&2
            exit 1
          fi
      - name: Upload draft, verify uploaded assets, then publish
        run: |
          gh release create "$TAG" --verify-tag --draft --title "$TAG" --generate-notes \
            "dist/phlo-monitor_${TAG}_linux_amd64" \
            "dist/phlo-monitor_${TAG}_linux_arm64" \
            "dist/phlo-monitor_${TAG}_SHA256SUMS"
          gh release download "$TAG" --dir verified --pattern "phlo-monitor_${TAG}_*"
          cmp "dist/phlo-monitor_${TAG}_SHA256SUMS" "verified/phlo-monitor_${TAG}_SHA256SUMS"
          (cd verified && sha256sum --strict --check "phlo-monitor_${TAG}_SHA256SUMS")
          test "$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)" = "$COMMIT"
          gh release edit "$TAG" --draft=false
